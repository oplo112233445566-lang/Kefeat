<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <title>الوصل و الفصل</title>
<style>
:root{
  --bg:#f6f9ff; --ink:#1c2b4d; --muted:#6a7a99; --card:#ffffff; --line:#dbe4f7; --shade:#cfdaf2;
  --pri:#3b5bfd; --pri-d:#2640c4; --gold:#ffb703; --gold-d:#d98e00; --ok:#22b573; --bad:#ef4565;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro","Arial",sans-serif;
  -webkit-user-select:none;user-select:none}
body{background:radial-gradient(1200px 600px at 100% -10%,#e6edff 0,transparent 60%),radial-gradient(900px 500px at 0% 110%,#fff0d6 0,transparent 60%),var(--bg)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg svg{position:absolute;opacity:.5;animation:float 11s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(28,43,77,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:26px;padding:26px;max-width:460px;width:100%;text-align:center;border:3px solid var(--line);box-shadow:0 10px 0 var(--shade)}
.modal p{font-size:clamp(19px,3.4vw,26px);font-weight:800;margin:6px 0 18px}
#app{position:relative;z-index:1;min-height:100vh;max-width:1080px;margin:0 auto;
  padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
h1{font-size:clamp(30px,6.5vw,60px);margin:.15em 0;line-height:1.25;font-weight:900}
h2{font-size:clamp(20px,3.6vw,30px);margin:.1em 0 .5em;font-weight:800}
p{margin:.4em 0;line-height:1.7}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:26px;padding:clamp(16px,3vw,28px);border:3px solid var(--line);box-shadow:0 8px 0 var(--shade)}
.center{text-align:center}
.btn{font:inherit;font-weight:800;font-size:clamp(18px,3vw,26px);border:0;border-radius:18px;padding:14px 30px;cursor:pointer;
  background:var(--pri);color:#fff;min-height:58px;box-shadow:0 6px 0 var(--pri-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pri-d)}
.btn.gold{background:var(--gold);color:#3a2600;box-shadow:0 6px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--shade)}
.btn.ghost:active{box-shadow:0 1px 0 var(--shade)}
.btn.big{font-size:clamp(24px,5vw,38px);padding:18px 46px;min-height:74px}
.btn.sm{font-size:17px;min-height:44px;padding:8px 18px;box-shadow:0 4px 0 var(--shade)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:16px;color:var(--muted);margin-bottom:6px;font-weight:700}
input[type=text],select{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);min-height:54px;-webkit-user-select:text;user-select:text}
input[type=text]:focus,select:focus{outline:none;border-color:var(--pri)}
.tname{display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;border-radius:50%;flex:none;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;display:inline-block}

/* hero */
.hero{position:relative;text-align:center;padding:26px 14px 10px}
.hero .pill{display:inline-block;background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 18px;font-weight:800;color:var(--pri);margin-bottom:8px}
.hero h1 span{display:inline-block;background:linear-gradient(transparent 62%,#ffe08a 62%);padding:0 10px}

/* top bar of question */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.tbadge{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 20px 6px 8px;font-weight:900;font-size:clamp(18px,3.6vw,30px);box-shadow:0 5px 0 var(--shade)}
.tbadge .badge{width:44px;height:44px;font-size:22px}
.scorebox{background:#fff7dc;border:3px solid #ffe08a;border-radius:18px;padding:6px 16px;font-weight:900;font-size:clamp(18px,3.4vw,28px);color:#8a5a00;text-align:center;line-height:1.2}
.scorebox small{display:block;font-size:13px;color:#a67b25;font-weight:700}
.ring{position:relative;width:clamp(84px,16vw,120px);height:clamp(84px,16vw,120px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--ok);transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.low .fg{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4.4vw,34px);font-weight:900;font-variant-numeric:tabular-nums}
.ring.low b{color:var(--bad);animation:beat .6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.prog i{width:clamp(14px,3vw,26px);height:10px;border-radius:6px;background:var(--line)}
.prog i.done{background:var(--ok)} .prog i.cur{background:var(--gold)}
.q{font-size:clamp(24px,5vw,44px);font-weight:900;line-height:1.65;text-align:center;padding:clamp(18px,4vw,40px) 14px;position:relative}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-weight:800;font-size:clamp(20px,3.6vw,32px);color:var(--ink);background:#fff;border:3px solid var(--line);
  border-radius:20px;padding:14px 16px;min-height:82px;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:right;box-shadow:0 6px 0 var(--shade);transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade)}
.opt .l{width:46px;height:46px;border-radius:14px;background:#eef2ff;color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;font-size:24px}
.opt.ok{background:#dcf8ea;border-color:var(--ok);box-shadow:0 6px 0 #14935a;animation:pop .4s}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{background:#ffe4ea;border-color:var(--bad);box-shadow:0 6px 0 #c42a49;animation:shake .4s}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(8px)}40%{transform:translateX(-8px)}60%{transform:translateX(5px)}80%{transform:translateX(-5px)}}
.note{min-height:2.8em;text-align:center;font-size:clamp(17px,2.8vw,24px);font-weight:800}

/* intro/end */
.avatar{width:clamp(96px,18vw,150px);height:clamp(96px,18vw,150px);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:clamp(48px,10vw,84px);box-shadow:0 8px 0 rgba(0,0,0,.14);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.facts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.fact{background:#f1f5ff;border:3px solid var(--line);border-radius:18px;padding:8px 20px;font-weight:800;font-size:clamp(18px,3vw,26px)}
.fact small{display:block;color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;font-size:17px}
.chip b{color:#b87400}
.chip.now{border-color:var(--pri)}
.cd{font-size:clamp(110px,28vw,220px);font-weight:900;color:var(--pri);line-height:1.1;animation:cdpop .8s ease-out}
@keyframes cdpop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.bigscore{font-size:clamp(52px,12vw,110px);font-weight:900;color:#e08a00;line-height:1.1}

/* final */
.win{position:relative;text-align:center;background:linear-gradient(180deg,#fff7dc,#fff);border-color:#ffe08a;overflow:hidden}
.win svg.cup{width:clamp(110px,22vw,170px);animation:bob 1.8s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(224,138,0,.25))}
.win h1{margin:.1em 0}
.rank{position:relative;display:flex;align-items:center;gap:12px;background:#f1f5ff;border-radius:18px;padding:12px 16px;margin:10px 0;font-size:clamp(20px,3.6vw,30px);font-weight:900;overflow:hidden;border:3px solid var(--line)}
.rank .fill{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.14;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
[dir=rtl] .rank .fill{inset:0 0 0 auto}
.rank>*:not(.fill){position:relative}
.rank .n{width:2.2em;text-align:center}
.rank .nm{flex:1}
.rank .pt{color:#b87400}
.rank.top1{background:#fff3c4;border-color:#ffd24d}
.pause{position:fixed;inset:0;background:rgba(246,249,255,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:10}
.qtag{display:inline-block;background:#eef2ff;color:var(--pri);font-weight:800;border-radius:999px;padding:3px 16px;font-size:15px;margin-bottom:8px}
.blank{display:inline-block;min-width:3.4em;border-bottom:5px dashed var(--pri);margin:0 8px;padding:0 8px;color:var(--pri);vertical-align:bottom;min-height:1.2em}
.blank.ok{color:var(--ok);border-bottom:5px solid var(--ok)}
.blank.bad{color:var(--bad);border-bottom:5px solid var(--bad)}
.q.sm{font-size:clamp(20px,3.6vw,30px)}
.opts.two{grid-template-columns:1fr 1fr}
.opt.tf{justify-content:center;font-size:clamp(26px,5vw,40px);min-height:96px}
.match{position:relative;display:flex;gap:clamp(40px,11vw,120px);justify-content:center;align-items:stretch}
.mcol{flex:1;display:flex;flex-direction:column;gap:12px;max-width:430px}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mi{font:inherit;font-weight:800;font-size:clamp(17px,3vw,26px);color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 10px;min-height:68px;cursor:pointer;box-shadow:0 5px 0 var(--shade);flex:1;transition:transform .08s}
.mi.sel{border-color:var(--pri);background:#eef2ff;transform:translateY(-3px)}
.mi.done{pointer-events:none;background:var(--tint,#f1f5ff);border-color:var(--bc,var(--line))}
.mi.wrong{border-color:var(--bad);background:#ffe4ea;animation:shake .4s}
.mhint{text-align:center;color:var(--muted);font-weight:700;font-size:16px}
@media(prefers-reduced-motion:reduce){#bg svg,.avatar,.win svg.cup,.ring.low b{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div id="app"></div>

<script>
/* =====================================================
   بنك الأسئلة — يمكنك تعديله أو إضافة أسئلة جديدة
   c = الإجابة الصحيحة | w = ثلاث إجابات خاطئة | e = توضيح (اختياري)
   يجب أن يكون عدد الأسئلة 36 على الأقل
   ===================================================== */
const QUESTIONS = [
 {q:"كم كلمة تتكوّن منها (لبيتنا)؟", c:"ثلاث كلمات", w:["كلمة واحدة","كلمتان","أربع كلمات"], e:"اللام + بيت + نا"},
 {q:"(كهرومغناطيسية) مكوّنة من:", c:"كهرباء + مغناطيس", w:["كهرب + مغنطة","كهرو + مغناطيس","كهرباء + مغنطيسي"]},
 {q:"(بعلبك) مكوّنة من:", c:"بعل + بك", w:["بع + لبك","بعلب + ك","بعل + بيك"]},
 {q:"(رأسمالية) مكوّنة من:", c:"رأس + مالية", w:["رأس + مال","را + سمالية","رأسم + الية"]},
 {q:"(حينئذٍ) مكوّنة من:", c:"حين + إذ", w:["حي + نئذ","حين + أذى","حينا + إذن"]},
 {q:"(وقتئذٍ) مكوّنة من:", c:"وقت + إذ", w:["وق + تئذ","وقتا + إذن","وقت + أذى"]},
 {q:"(حبّذا) مكوّنة من:", c:"حبّ + ذا", w:["حب + أذى","ح + بذا","حبّا + ذا"]},
 {q:"(يومئذٍ) مكوّنة من:", c:"يوم + إذ", w:["يوم + إذا","يومًا + أن","يو + مئذ"]},
 {q:"أصل (ألّا) في: يجب ألّا تتأخر", c:"أن + لا", w:["إن + لا","أنّ + لم","أن + لن"]},
 {q:"أصل (إلّا) في: إلّا تذاكر تفشل", c:"إن + لا", w:["أن + لا","إلى + لا","إذا + لا"]},
 {q:"أصل (لئلّا) هو:", c:"لأن + لا", w:["لكي + لا","لإن + لا","لأنّ + لا"]},
 {q:"أصل (لكيلا) هو:", c:"لكي + لا", w:["لأن + لا","لكي + لم","لكن + لا"]},
 {q:"أصل (ممَّن) في: ممَّن أخذتَ العلم؟", c:"مِن + مَن", w:["مِن + ما","عن + مَن","مِن + مِن"]},
 {q:"أصل (عمَّن) في: عمَّن تتحدث؟", c:"عن + مَن", w:["عن + ما","من + عن","على + مَن"]},
 {q:"عند وصل (من) و(عن) بـ(مَن) نحذف حرف:", c:"النون", w:["الألف","الميم","الواو"], e:"مِنْ + مَن = ممَّن  /  عنْ + مَن = عمَّن"},
 {q:"أيّ الحروف الآتية توصل بـ(مَن) كتابةً؟", c:"في، اللام، الباء", w:["ثم، أو، بل","لا، لن، لم","هل، أم، ألا"], e:"فيمَن، لمَن، بمَن"},
 {q:"أصل (مِمَّ) في: مِمَّ تتكوّن الخلية؟", c:"مِن + ما", w:["مِن + مَن","عن + ما","في + ما"]},
 {q:"أصل (عمَّ) في: عمَّ تتساءل؟", c:"عن + ما", w:["عن + مَن","من + ما","على + ما"]},
 {q:"أصل (لِمَ) في: لِمَ تقرأ؟", c:"اللام + ما", w:["اللام + مَن","لا + ما","لم + ما"]},
 {q:"أصل (إلامَ) في: إلامَ ترجع الظروف؟", c:"إلى + ما", w:["إلى + مَن","إلا + ما","على + ما"]},
 {q:"أصل (علامَ) في: علامَ تضع الكراسة؟", c:"على + ما", w:["على + مَن","عن + ما","إلى + ما"]},
 {q:"عند وصل (ما) الاستفهامية بحرف الجر نحذف:", c:"ألف (ما)", w:["نون حرف الجر","ميم (ما)","لا نحذف شيئًا"]},
 {q:"في (إنّما، كأنّما، ليتما، لكنّما) وُصلت (ما) بـ:", c:"الحروف الناسخة", w:["الأفعال","أسماء الاستفهام","حروف العطف"]},
 {q:"في (أينما، كيفما) وُصلت (ما) بـ:", c:"أسماء الشرط", w:["حروف الجر","الأفعال الماضية","الضمائر"]},
 {q:"في (عندما، كلّما، حينما) وُصلت (ما) بـ:", c:"الظروف", w:["الحروف الناسخة","حروف الجر","الأسماء الموصولة"]},
 {q:"كيف تُكتب (على + ما) الاستفهامية في: ___ يدلّ حرصك؟", c:"علامَ", w:["على ما","عَلَمَ","علاما"]},
 {q:"كيف تُكتب (من + مَن) في: ___ هؤلاء كان الأفضل؟", c:"ممَّن", w:["من مَن","منمن","ممْن"]},
 {q:"في: (الحلزون من طائفة البطنقدميات) الكلمة مكوّنة من:", c:"البطن + قدم", w:["بطن + قدمي","البط + نقدميات","ال + بطنقدم"]},
 {q:"أصل (مثلما) في: اقتربتُ مثلما اقتربتَ:", c:"مثل + ما", w:["مثلُ + مَن","مِن + ثلما","مثلا + ما"]},
 {q:"أيّ الكتابات الآتية صحيحة وفق الدرس؟", c:"ثلاث مئة", w:["ثلاثمئة","ثلاثمئه","ثلاثمأة"], e:"تُفصل (مئة) عن عددها لأنها مكوّنة من كلمتين"},
 {q:"أيّ مما يأتي يجب وصله بما قبله؟", c:"تاء الفاعل في (أكلتُ)", w:["كلمة (الفاكهة)","كلمة (كلّها)","كلمة (أكلَ)"], e:"ما كان من حرف أو حرفين ولا يصحّ الابتداء به يجب وصله"},
 {q:"لا تتصل (كي) بـ(لا) إذا:", c:"لم تتصل بها اللام", w:["سبقتها الواو","جاء بعدها فعل ماضٍ","سبقها فعل ظنّ"], e:"وابن السبيل كي لا يكون دولة"},
 {q:"لا تتصل (أن) بـ(لا) إذا:", c:"سبقت بفعل يدلّ على اليقين أو الظن", w:["سبقها حرف جر","جاء بعدها اسم","سبقتها اللام"], e:"وظنّوا أن لا ملجأ من الله إلا إليه"},
 {q:"في: (عجبتُ مما رأيت) لا تُحذف ألف (ما) لأنها:", c:"ما الموصولة", w:["ما الاستفهامية","ما النافية","ما المصدرية"]},
 {q:"(فيمَ تفكّر؟) حرف الجر + ما:", c:"الاستفهامية", w:["الموصولة","النافية","الزائدة"]},
 {q:"(تأمّلتُ فيما حولي) حرف الجر + ما:", c:"الموصولة", w:["الاستفهامية","النافية","الشرطية"]},
 {q:"(يدافع المحامي عمَّن تولّى أمره) كلمة (عمَّن) هي:", c:"عن + مَن الموصولة", w:["عن + مَن الاستفهامية","عن + ما الموصولة","على + مَن"]},
 {q:"(ممَّن دنوتَ؟) كلمة (ممَّن) هي:", c:"من + مَن الاستفهامية", w:["من + ما الموصولة","من + ما الاستفهامية","عن + مَن الموصولة"]},
 {q:"إذا اتصلت اللام بـ(كي) فإنها تُكتب مع (لا):", c:"لكيلا (متصلة)", w:["لكي لا (منفصلة)","كيلا (بلا لام)","لكي-لا (بشرطة)"]},
 {q:"أصل (كأنّما) في: كأنّما الأبطال أسود:", c:"كأنّ + ما", w:["كأن + مَن","كي + أنّما","كأنْ + لا"]},

 /* ---- أسئلة إضافية ---- */
 {q:"(تعلّمتُ ممّا قرأتُ) نوع (ما) هنا:", c:"موصولة", w:["استفهامية","نافية","شرطية"]},
 {q:"لماذا بقيت ألف (ما) في: ابتعدتُ عمَّا يغضب الله؟", c:"لأن (ما) موصولة", w:["لأن (ما) استفهامية","لأن الكلمة فعل","لأن (عن) حرف عطف"]},

/* نافذة تأكيد داخل الصفحة (بدل confirm الذي قد يُحجب) */
function ask(msg,yes){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><p>${esc(msg)}</p><div class="row c"><button class="btn gold" id="yy">نعم</button><button class="btn ghost" id="nn">إلغاء</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#yy').onclick=()=>{m.remove();yes()};
  m.querySelector('#nn').onclick=()=>m.remove();
}

/* ============ الصوت ============ */
function tone(f,d,t,delay,vol){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=t||'sine';o.frequency.value=f;
    const st=actx.currentTime+(delay||0);
    g.gain.setValueAtTime(vol||.16,st);g.gain.exponentialRampToValueAtTime(.001,st+d);
    o.connect(g);g.connect(actx.destination);o.start(st);o.stop(st+d);
  }catch(e){}
}
const sndOk=()=>{tone(660,.15);tone(880,.25,'sine',.12)};
const sndBad=()=>{tone(180,.35,'sawtooth',0,.1)};
const sndEnd=()=>{tone(520,.2,'triangle');tone(390,.2,'triangle',.2);tone(260,.4,'triangle',.4)};
const sndFanfare=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',i*.16,.2));tone(1047,.7,'triangle',.7,.2);tone(784,.7,'sine',.7,.1)};

async function keepAwake(){
  try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S&&S.phase==='q')keepAwake()});

function sizeCv(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
sizeCv();addEventListener('resize',sizeCv);
const FXCOLS=['#e63946','#1d7fe0','#1fa463','#f08a00','#8b3fd9','#0fa3a3','#ffb703','#ff6fa5'];
function addPart(x,y,vx,vy,cols,g){
  parts.push({x,y,vx,vy,g:g||.28,r:5+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.35,
    c:cols[Math.floor(Math.random()*cols.length)],t:Math.floor(Math.random()*3),a:1,drag:.992});
}
function burst(x,y,n,cols){
  n=reduceMotion?Math.ceil(n/4):n;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*9;addPart(x,y,Math.cos(a)*s,Math.sin(a)*s-3,cols||FXCOLS,.22)}
  runFx();
}
function rain(n,cols){
  n=reduceMotion?Math.ceil(n/4):n;
  for(let i=0;i<n;i++)addPart(Math.random()*innerWidth,-20-Math.random()*200,(Math.random()-.5)*3,2+Math.random()*3,cols||FXCOLS,.06);
  runFx();
}
function runFx(){if(!raf)raf=requestAnimationFrame(loop)}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+40&&p.a>0.02);
  for(const p of parts){
    p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    if(p.y>innerHeight*.75&&p.g>.2)p.a-=.015;
    ctx.save();ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.t===0)ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);
    else if(p.t===1){ctx.beginPath();ctx.arc(0,0,p.r/2.2,0,7);ctx.fill()}
    else star(0,0,p.r*.8);
    ctx.restore();
  }
  raf=parts.length?requestAnimationFrame(loop):null;
  if(!raf)ctx.clearRect(0,0,innerWidth,innerHeight);
}
function stopFx(){fxTimers.forEach(clearInterval);fxTimers=[];parts=[];if(raf){cancelAnimationFrame(raf);raf=null}ctx.clearRect(0,0,innerWidth,innerHeight)}
function celebrate(cols){
  stopFx();sndFanfare();
  cols=cols&&cols.length?cols.concat(FXCOLS):FXCOLS;
  rain(140,cols);
  let n=0;
  const t=setInterval(()=>{
    n++;
    burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.35),55,cols);
    if(n%3===0)rain(45,cols);
    if(n>=14){clearInterval(t)}
  },520);
  fxTimers.push(t);
}

/* توزيع الأسئلة: لكل مجموعة مزيج من الأنواع بلا تكرار بين المجموعات */
function deal(N,teams){
  const by={mc:[],tf:[],fill:[],match:[]};
  QUESTIONS.forEach((q,i)=>by[q.t||'mc'].push(i));
  for(const k in by)by[k]=shuffle(by[k]);
  const quota={match:Math.round(N*.15),tf:Math.round(N*.2),fill:Math.round(N*.2)};
  quota.mc=N-quota.match-quota.tf-quota.fill;
  const out=[];
  for(let t=0;t<teams;t++){
    const qs=[];
    for(const k of ['match','tf','fill','mc'])for(let j=0;j<quota[k];j++)if(by[k].length)qs.push(by[k].pop());
    while(qs.length<N){const k=['mc','fill','tf','match'].find(k=>by[k].length);if(!k)break;qs.push(by[k].pop())}
    out.push(shuffle(qs));
  }
  return out;
}
function newGame(set){
  const deals=deal(set.count,6);
  S={set,cur:0,left:set.time,phase:'intro',reason:'',
     teams:set.names.map((n,i)=>({name:n,score:0,done:0,qs:deals[i]}))};
  save();showIntro();
}
function resumeGame(){
  if(!S)return showSetup();
  if(S.phase==='final')return showFinal();
  if(S.phase==='end')return showEnd();
  showIntro();
}

function chips(){
  return `<div class="chips">${S.teams.map((t,i)=>`<div class="chip ${i===S.cur?'now':''}"><span class="dot" style="background:${COLORS[i]}"></span>${esc(t.name)} <b>${toAr(t.score)}</b></div>`).join('')}</div>`;
}

/* ============ السؤال ============ */
const CIRC=2*Math.PI*44;
const TAGS={mc:'اختر الإجابة الصحيحة',tf:'صح أم خطأ؟',fill:'أكمل الفراغ',match:'وصّل بالخط'};
function showQ(){
  const t=S.teams[S.cur];
  if(t.done>=t.qs.length){S.reason='أنهت المجموعة جميع أسئلتها';return showEnd()}
  if(S.left<=0){S.reason='انتهى الوقت';return showEnd()}
  S.phase='q';save();locked=false;paused=false;
  const raw=QUESTIONS[t.qs[t.done]],col=COLORS[S.cur],type=raw.t||'mc';
  const q=type==='tf'?{...raw,c:raw.a?'صح':'خطأ'}:raw;
  let prog='';for(let i=0;i<t.qs.length;i++)prog+=`<i class="${i<t.done?'done':i===t.done?'cur':''}"></i>`;
  const qHtml=type==='fill'?esc(q.q).replace('___','<span class="blank" id="blank"></span>'):esc(q.q);
  let body;
  if(type==='match')body='<div id="qbody"></div>';
  else if(type==='tf')body=`<div class="opts two"><button class="opt tf" data-v="صح"><span class="l">✔</span><span>صح</span></button><button class="opt tf" data-v="خطأ"><span class="l">✘</span><span>خطأ</span></button></div>`;
  else{const opts=shuffle([q.c,...q.w]);body=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><span class="l">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`}
  app.innerHTML=`
   <div class="top">
     <div class="tbadge"><span class="badge" style="background:${col}">${toAr(S.cur+1)}</span>${esc(t.name)}</div>
     <div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44" fill="none" stroke-width="9"/><circle class="fg" id="fg" cx="50" cy="50" r="44" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg><b id="tm">${fmt(S.left)}</b></div>
     <div class="scorebox"><small>النقاط</small>${toAr(t.score)}</div>
   </div>
   <div class="prog">${prog}</div>
   <div class="card q ${type==='match'?'sm':''}" style="border-color:${col}"><div class="qtag">${TAGS[type]}</div><div>${qHtml}</div></div>
   ${body}
   <div class="note" id="note"></div>
   <div class="row c"><button class="btn ghost sm" id="pz">إيقاف مؤقت</button></div>`;
  if(type==='match')renderMatch(q);
  else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,q,type));
  $('#pz').onclick=pauseGame;
  startTimer();
}
function startTimer(){stopTimer();endAt=Date.now()+S.left*1000;tick();timer=setInterval(tick,200)}
function stopTimer(){
  if(timer){clearInterval(timer);timer=null;
    if(S&&S.phase==='q')S.left=Math.max(0,Math.ceil((endAt-Date.now())/1000));}
}
function tick(){
  const left=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  S.left=left;
  const tm=$('#tm'),fg=$('#fg'),ring=$('#ring');
  if(tm)tm.textContent=fmt(left);
  if(fg)fg.style.strokeDashoffset=CIRC*(1-left/S.set.time);
  if(ring)ring.classList.toggle('low',left<=10);
  if(left<=0){clearInterval(timer);timer=null;locked=true;S.reason='انتهى الوقت';sndEnd();showEnd()}
}

/* تسجيل نتيجة السؤال والانتقال للتالي */
function finish(ok,text){
  const t=S.teams[S.cur];
  t.done++;if(ok)t.score++;
  const note=$('#note');
  if(note){note.style.color=ok?'#14935a':'#c42a49';note.textContent=text}
  if(ok){sndOk();burst(innerWidth/2,innerHeight*.55,26,[COLORS[S.cur],'#ffb703','#22b573'])}else sndBad();
  save();
  setTimeout(()=>{if(S&&S.phase==='q'&&!paused)showQ()},ok?1200:2600);
}

/* اختيار من متعدد / صح وخطأ / فراغات */
function answer(btn,q,type){
  if(locked||paused)return;
  locked=true;stopTimer();
  const ok=btn.dataset.v===q.c;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.dataset.v===q.c)b.classList.add('ok');
    else if(b===btn)b.classList.add('bad');
    else b.classList.add('dim');
  });
  if(type==='fill'){const bl=$('#blank');if(bl){bl.textContent=btn.dataset.v;bl.classList.add(ok?'ok':'bad')}}
  finish(ok,ok?('أحسنتم! '+(q.e||'')):('الإجابة الصحيحة: '+q.c+(q.e?' — '+q.e:'')));
}

/* التوصيل: اضغط كلمة ثم ما يناسبها. نقطة واحدة إذا اكتمل التوصيل بلا أخطاء */
function renderMatch(q){
  const LC=['#e63946','#1d7fe0','#1fa463','#f08a00'];
  const A=shuffle(q.pairs.map((p,i)=>({i,x:p[0]})));
  const B=shuffle(q.pairs.map((p,i)=>({i,x:p[1]})));
  $('#qbody').innerHTML=`<div class="mhint">اضغط كلمة ثم اضغط ما يناسبها</div>
    <div class="match" id="mt"><svg class="lines" id="lines"></svg>
      <div class="mcol">${A.map(o=>`<button class="mi" data-s="a" data-i="${o.i}">${esc(o.x)}</button>`).join('')}</div>
      <div class="mcol">${B.map(o=>`<button class="mi" data-s="b" data-i="${o.i}">${esc(o.x)}</button>`).join('')}</div>
    </div>`;
  let sel=null,mistake=false,matched=0;
  const total=q.pairs.length;
  document.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{
    if(locked||paused||b.classList.contains('done'))return;
    if(!sel){sel=b;b.classList.add('sel');return}
    if(sel===b){b.classList.remove('sel');sel=null;return}
    if(sel.dataset.s===b.dataset.s){sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
    const first=sel;sel=null;first.classList.remove('sel');
    if(first.dataset.i===b.dataset.i){
      const c=LC[matched%LC.length];
      [first,b].forEach(x=>{x.classList.add('done');x.style.setProperty('--bc',c);x.style.setProperty('--tint',c+'22')});
      const box=$('#mt').getBoundingClientRect(),r1=first.getBoundingClientRect(),r2=b.getBoundingClientRect();
      const L=r1.left<r2.left?r1:r2,R=r1.left<r2.left?r2:r1;
      const ln=`<line x1="${L.right-box.left}" y1="${L.top+L.height/2-box.top}" x2="${R.left-box.left}" y2="${R.top+R.height/2-box.top}" stroke="${c}" stroke-width="6" stroke-linecap="round"/><circle cx="${L.right-box.left}" cy="${L.top+L.height/2-box.top}" r="7" fill="${c}"/><circle cx="${R.left-box.left}" cy="${R.top+R.height/2-box.top}" r="7" fill="${c}"/>`;
      $('#lines').insertAdjacentHTML('beforeend',ln);
      matched++;tone(740,.12);
      if(matched===total){
        locked=true;stopTimer();
        finish(!mistake,mistake?'اكتمل التوصيل لكن كان فيه خطأ — لا نقطة':'أحسنتم! توصيل صحيح كاملًا');
      }
    }else{
      mistake=true;sndBad();
      [first,b].forEach(x=>x.classList.add('wrong'));
      setTimeout(()=>[first,b].forEach(x=>x.classList.remove('wrong')),500);
    }
  });
}
function pauseGame(){
  if(locked||paused)return;
  paused=true;stopTimer();
  const o=document.createElement('div');o.className='pause';o.id='pov';
  o.innerHTML='<h1>إيقاف مؤقت</h1><button class="btn gold big" id="rs">استمرار</button><button class="btn ghost sm" id="mn">القائمة</button>';
  document.body.appendChild(o);
  $('#rs').onclick=()=>{o.remove();paused=false;startTimer()};
  $('#mn').onclick=()=>ask('العودة للقائمة؟ يمكنك متابعة اللعبة لاحقًا.',()=>{o.remove();showSetup()});
}

   </div>
   <div class="card">
     <h2>الترتيب النهائي</h2>
     ${arr.map((t,k)=>`
     <div class="rank ${t.score===top?'top1':''}" style="--c:${COLORS[t.i]}">
       <span class="fill" data-w="${top?Math.round(t.score/top*100):0}"></span>

       <span class="dot" style="background:${COLORS[t.i]};width:18px;height:18px"></span>
       <span class="nm">${esc(t.name)}</span>

     <button class="btn" id="party">🎊 احتفال</button>

  $('#again').onclick=()=>{stopFx();newGame(S.set)};

/* ============ تشغيل ============ */
(function init(){
  const set=store.get('wf_settings');
  if(set&&set.sound===false)soundOn=false;
  const saved=store.get('wf_game');
  if(saved&&saved.phase==='final'){S=saved;showFinal()}
  else showSetup();
})();
</script>
